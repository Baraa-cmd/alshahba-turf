name: Deploy to Spaceship via FTP

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies and build
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Deploy to FTP Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: server64.shared.spaceship.host
        username: ${{ secrets.FTP_USERNAME || secrets.USERNAME || 'Bro@al-shahbaa.dierhafer.site' }}
        password: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD || secrets.FTP_PASS || secrets.PASS || 'B135792468b' }}
        port: 21
        local-dir: ./dist/
        server-dir: ./



